# BeatFlow's native shell — a standalone Slint crate that ports the desktop
# app's UI off the web stack, one component at a time (see native/README.md
# and .claude/NATIVE_MIGRATION_BLUEPRINT.md). Playback is mocked here; the
# audio engine arrives with the blueprint's Stage 1.
[package]
name = "beatflow-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "BeatFlow's native (Slint) desktop shell — UI skeleton"
publish = false

[dependencies]
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
# raw-window-handle is re-exposed by slint with the feature above, but the
# HWND plumbing below names the types directly.
raw-window-handle = "0.6"
window-vibrancy = "0.8"
# Backend (audio, streaming, search) adapted from refrence/rust.
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-flac", "symphonia-mp3", "symphonia-vorbis"] }
crossbeam-channel = "0.5"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusty-opus = "1"
rquickjs = "0.14"
sha1 = "0.10"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "gzip", "json", "socks", "stream"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "vorbis", "wav", "isomp4", "mkv"] }
url = "2"
wry = "0.54"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry"] }

[build-dependencies]
slint-build = "1.18.1"
