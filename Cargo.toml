[package]
name = "beatflow"
version = "1.9.2"
description = "BeatFlow Native Desktop Music Player"
authors = ["Abhi Devkota <abhidevkota1234@gmail.com>"]
edition = "2024"
rust-version = "1.90"

[dependencies]
slint = "1.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
anyhow = "1.0"
thiserror = "2.0"
url = "2.5"
roxmltree = "0.21"
mp4ameta = "0.13.0"
dirs = "6.0"
base64 = "0.22"
rodio = { version = "0.20.1", default-features = true }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
unicode-normalization = "0.1"
urlencoding = "2.1"
rand = "0.9"

[build-dependencies]
slint-build = "1.18.1"

[workspace]
members = [
    ".",
    "desktop/src-tauri",
]
